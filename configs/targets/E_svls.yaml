# 文献对照臂 E：SVLS 式空间可变标签平滑（Islam & Glocker, IPMI 2021 再实现）。
#
# 【它在本文里的位置】
# 与 C 臂（consensus）形式完全相同：Dice 打硬掩膜 V>=2，BCE 打一张软靶。
# 唯一差别是软靶的来源：
#   C 臂  软靶 = p = V/4      来自四位医生的真实投票
#   E 臂  软靶 = 高斯平滑掩膜  来自单张融合掩膜的几何形状，不需要多标注者
#
# 因此 C - E 的差值，量化的正是"多标注者投票相对于纯几何平滑，到底多提供了
# 多少信息"。若差值落在噪声基线（2sigma = 1.12 点）以内，那么共识概率监督
# 这条文献线的价值就需要重新评估——这是一个有分量的阴性结果，必须如实报告。
#
# 【必须在论文里写明】这是再实现，不是原作者代码；原文面向多类分割 + 交叉熵，
# 本文是二分类单 logit 设定。核尺寸与 sigma 在下方显式给出。
loss:
  target: svls
  use_dice: true
  use_bce: true
  use_sitl: false
  use_csl: false
  use_brbc: false
  use_lovasz: false
  svls:
    # 【核宽是标定过的，不是随手取的】scripts/calibrate_svls.py 在本队列 300 个
    # 结节 patch 上实测：真实投票的「软区/硬掩膜面积」= 1.04，ksize=3 给出 0.98
    # （比值 0.94），ksize=5 给出 1.91（1.83 倍），ksize=7 给出 2.78（2.66 倍）。
    # 所以原文默认的 ksize=3 恰好匹配本数据的标注者分歧带宽，既没被做窄成硬掩膜，
    # 也没被做宽成过度平滑。这一条要写进论文，用来回应"你的对照基线不公平"。
    #
    # 注意：带宽由 ksize 决定，sigma 只改变带内取值形状——ksize=3 时
    # sigma 取 0.5/1/2 带宽完全相同。
    ksize: 3      # 高斯核边长（奇数）
    sigma: 1.0    # 高斯标准差，单位像素

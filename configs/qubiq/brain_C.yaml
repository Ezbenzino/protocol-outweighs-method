# QUBIQ-brain-growth 训练靶 C：多数硬掩膜（Dice）+ 软共识 p=V/7（BCE）。
# 与 LIDC C_maj_soft 同构，仅 n_raters=7。7 标注者下软概率监督的独立贡献。
loss:
  target: consensus
  use_dice: true
  use_bce: true
  use_sitl: false
  use_csl: false
  use_brbc: false
  use_lovasz: false
train:
  batch_size: 4

data:
  patch_dir: ""
  n_raters: 7
  npz_dir: data/qubiq/brain/npz
  split_dir: data/qubiq/brain/splits

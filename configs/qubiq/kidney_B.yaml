# QUBIQ-kidney 训练靶 B：多数投票 V>=ceil(3/2)=2（与 LIDC B_majority 同构，n_raters=3）。
# 外部数据集验证（P2-1）：QUBIQ 的 B 臂是"干净多数"基准，用于拆解掩膜范围 vs 软/硬监督。
loss:
  target: majority
  use_dice: true
  use_bce: true
  use_sitl: false
  use_csl: false
  use_brbc: false
  use_lovasz: false
train:
  batch_size: 4

data:
  patch_dir: ""
  n_raters: 3
  npz_dir: data/qubiq/kidney/npz
  split_dir: data/qubiq/kidney/splits
